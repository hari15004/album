<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a11;--red:#e5202f;--red2:#9b0f1b;--card:#151518;--line:#ffffff17;--txt:#f6f6f6;--mut:#a9a9b0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:0 auto;padding:18px 16px 30px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-8%;background:radial-gradient(ellipse 38% 30% at 13% 14%,#ff4e8a66,transparent 74%),radial-gradient(ellipse 40% 34% at 88% 18%,#934eff55,transparent 76%),radial-gradient(ellipse 48% 34% at 92% 78%,#e82e5a44,transparent 72%),radial-gradient(ellipse 42% 32% at 18% 82%,#4434ad55,transparent 78%),linear-gradient(155deg,#100914 0%,#090b17 48%,#130b18 100%);filter:blur(12px);pointer-events:none;z-index:-1;animation:auroraDrift 24s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;background-image:radial-gradient(circle,#ffffffb8 0 1px,transparent 1.5px),radial-gradient(circle,#ffb5d1a6 0 1px,transparent 1.5px),radial-gradient(circle,#e9ccffa6 0 1px,transparent 1.5px);background-size:137px 171px,211px 227px,293px 251px;background-position:13px 19px,61px 89px,17px 130px;opacity:.34;mask-image:linear-gradient(to bottom,#000,transparent 95%);pointer-events:none;z-index:-1}
@keyframes auroraDrift{from{transform:translate3d(-1.5%,0,0) scale(1)}to{transform:translate3d(1.5%,-1%,0) scale(1.06)}}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.125em}
svg.f{fill:currentColor;stroke:none}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--red);font-weight:700}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:44px;line-height:.95;margin:4px 0 0;letter-spacing:.02em;text-shadow:0 6px 26px #e5202f55}
.webmark{width:54px;height:54px;color:#ffffff55;filter:drop-shadow(0 0 12px #ff5a9a77);transform:perspective(220px) rotateY(-16deg) rotateX(10deg)}
/* player */
.player{position:relative;background:linear-gradient(145deg,#fa526d 0%,#d51e42 42%,#651127 100%);border:1px solid #ffffff4a;border-radius:26px;padding:16px;display:grid;grid-template-columns:104px 1fr;gap:14px 16px;box-shadow:0 24px 48px -18px #ed315b99,0 8px 18px #0008,inset 0 1px 0 #ffffff70,inset 0 -2px 0 #320917;transform-style:preserve-3d;transition:transform .35s ease,box-shadow .35s ease;overflow:hidden}
.player::before{content:"";position:absolute;inset:0;background:linear-gradient(118deg,#ffffff32 0%,transparent 34%,transparent 68%,#0002 100%);pointer-events:none}
.player::after{content:"";position:absolute;right:-8px;top:-8px;width:120px;height:120px;background:radial-gradient(#00000040 1.6px,transparent 2px) 0 0/10px 10px;-webkit-mask:radial-gradient(circle at 100% 0,#000,transparent 70%);mask:radial-gradient(circle at 100% 0,#000,transparent 70%);pointer-events:none}
.art{width:104px;height:104px;border-radius:16px;background:#1a0407 center/cover;box-shadow:0 14px 24px #20050dcc,inset 0 1px 0 #ffffff77;border:1px solid #ffffff65;color:#ffffffb0;font:500 11px "DM Sans",sans-serif;cursor:pointer;display:grid;place-items:center;text-align:center;padding:6px;transform:translateZ(18px);transition:transform .3s ease,box-shadow .3s ease}
.meta{min-width:0;align-self:center;transform:translateZ(9px)}
.title{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:13px;opacity:.8;margin:2px 0 10px}
.bars{display:flex;gap:3px;align-items:flex-end;height:16px}
.bars i{width:3px;height:3px;background:#fff;border-radius:2px;opacity:.85}
.playing .bars i{animation:b .9s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.18s}.bars i:nth-child(3){animation-delay:.36s}.bars i:nth-child(4){animation-delay:.54s}.bars i:nth-child(5){animation-delay:.72s}
@keyframes b{50%{height:16px}}
.seek,.ctl{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p,0%),#ffffff44 var(--p,0%));margin:8px 0;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #ffffff33}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.time{display:flex;justify-content:space-between;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.ctl button{background:none;border:0;color:#fff;font-size:22px;padding:8px;border-radius:12px;cursor:pointer;opacity:.9}
.ctl button.on{background:#ffffff2e}
.ctl .pp{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#fff,#ffe0e8);color:var(--red2);font-size:26px;opacity:1;display:grid;place-items:center;box-shadow:0 12px 0 #a1112c,0 18px 26px #350715aa,inset 0 2px 2px #fff;transform:translateY(-3px) translateZ(12px);transition:transform .15s ease,box-shadow .15s ease}
.pp svg{margin-left:2px}.playing .pp svg{margin-left:0}
/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
h2{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:28px;margin:0;letter-spacing:.04em}
.count{font-size:12px;color:var(--mut)}
.slide{background:none;border:1px solid var(--line);color:var(--txt);font:500 12px "DM Sans",sans-serif;border-radius:20px;padding:7px 12px;cursor:pointer}
.mas{columns:2;column-gap:10px}
.ph{position:relative;break-inside:avoid;margin:0 0 10px;border-radius:14px;overflow:hidden;background:#1b1b1f;cursor:pointer;border:1px solid #ffffff24;box-shadow:0 8px 18px #0006,0 1px 0 #ffffff18 inset;transform-style:preserve-3d;transition:transform .3s ease,box-shadow .3s ease}
.ph img{display:block;width:100%;height:auto}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff28,transparent 32%,transparent 72%,#0004);opacity:.45;pointer-events:none;transform:translateZ(2px)}
.ph b{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--red);display:none;place-items:center;font-size:13px}
.edit .ph b,.edit .tr u{display:grid}
.edit .ph{animation:wig .35s infinite alternate}
@keyframes wig{to{transform:rotate(.6deg)}}
.tr{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid transparent;border-radius:14px;cursor:pointer;margin-bottom:4px;transition:transform .22s ease,background .22s ease,border-color .22s ease}
.tr .n{width:22px;color:var(--mut);font-size:13px;text-align:center}
.tr span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.tr .fav{background:none;border:0;color:var(--mut);font-size:19px;line-height:1;padding:4px;cursor:pointer}
.tr .fav.liked{color:#ff5260}
.tr.cur{background:#e5202f1f}.tr.cur .t,.tr.cur .n{color:#ff6b76}
.tr u{display:none;text-decoration:none;color:#ff6b76;padding:4px}
.empty{color:var(--mut);font-size:14px;padding:26px 10px;text-align:center;border:1px dashed var(--line);border-radius:14px;column-span:all}
/* navbar */
nav{display:flex;flex-direction:column;align-items:center;margin-top:40px;padding-top:16px}
.bar{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-around;background:linear-gradient(160deg,#29232fee,#131116f2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid #ffffff2a;border-radius:26px;padding:8px 6px;box-shadow:0 18px 34px #0009,0 2px 0 #ffffff12 inset,0 -2px 0 #0008 inset;transform:translateY(-2px);transition:transform .25s ease,box-shadow .25s ease}
.bar button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10.5px "DM Sans",sans-serif;padding:6px 12px;cursor:pointer;min-width:58px}
.bar button svg{font-size:21px}
.bar button.act{color:#fff}
.bar .add{background:var(--red);color:#fff;width:52px;height:52px;min-width:0;border-radius:50%;padding:0;margin-top:-26px;justify-content:center;box-shadow:0 10px 22px #e5202f88,0 0 0 5px var(--bg);transition:transform .2s}
.bar .add svg{font-size:26px}
.sheetOpen .add{transform:rotate(45deg)}
.sheet{display:none;width:100%;max-width:520px;margin-bottom:34px}
.sheetOpen .sheet{display:block}
.sheet .in{width:100%;max-width:520px;background:#1c1c21;border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 16px 40px #000b}
.opt{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:14px;cursor:pointer;font-size:15px}
.opt:active{background:#ffffff10}
.opt .ic{width:38px;height:38px;border-radius:12px;background:#e5202f26;color:#ff5260;display:grid;place-items:center;font-size:19px}
.opt small{display:block;color:var(--mut);font-size:12px}
input[type=file]{display:none}
#lb{position:fixed;inset:0;background:#000f;display:none;z-index:40;flex-direction:column;align-items:center;justify-content:center}
#lb.show{display:flex}
#lb img{max-width:100%;max-height:78%;border-radius:12px}
#lb .cap{margin-top:14px;font-size:14px;color:var(--mut)}
#lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:#ffffff18;border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px}
.adm{display:none!important}.isAdmin .adm{display:flex!important}
.alink{background:none;border:0;color:#ffffff3d;font:500 11px "DM Sans",sans-serif;margin-top:20px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#232328;border:1px solid var(--line);padding:10px 16px;border-radius:20px;font-size:13px;display:none;z-index:60;max-width:90%}
dialog{background:#1c1c21;color:var(--txt);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(340px,90%)}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 12px;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:26px}
dialog input{width:100%;background:#0e0e10;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;margin-bottom:10px;font:15px "DM Sans",sans-serif}
dialog div{display:flex;gap:8px}dialog button{flex:1;border:1px solid var(--line);background:none;color:#fff;border-radius:12px;padding:11px;font:500 14px "DM Sans",sans-serif;cursor:pointer}dialog .go{background:var(--red);border-color:var(--red)}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .player:hover{transform:perspective(900px) rotateX(2deg) rotateY(-2deg) translateY(-4px);box-shadow:0 30px 54px -18px #ed315bb3,0 12px 24px #0009,inset 0 1px 0 #ffffff70,inset 0 -2px 0 #320917}
  .player:hover .art{transform:translateZ(28px) rotateY(-3deg)}
  .mas:not(.edit) .ph:hover{transform:perspective(650px) rotateX(3deg) rotateY(-3deg) translateY(-5px) scale(1.015);box-shadow:0 20px 34px #000a,0 0 18px #ff5a9a33}
  .tr:not(.cur):hover{background:#ffffff0b;border-color:#ffffff12;transform:translateX(4px)}
  .bar:hover{transform:translateY(-4px);box-shadow:0 24px 44px #000b,0 2px 0 #ffffff18 inset,0 -2px 0 #0008 inset}
  .ctl .pp:hover{transform:translateY(-6px) translateZ(16px);box-shadow:0 14px 0 #a1112c,0 22px 30px #350715bb,inset 0 2px 2px #fff}
}
@media (prefers-reduced-motion:reduce){
  body::before,.player,.ph,.tr,.bar,.ctl .pp{transition:none!important;animation:none!important}
  .playing .bars i{animation:none!important}
}
</style>
</head>
<body>
<header>
  <div><h1>Memory<br>Album</h1></div>
  <svg class="webmark i" viewBox="0 0 48 48" style="stroke-width:1"><path d="M2 2 46 46M2 14 46 34M14 2 34 46M2 26 38 46M26 2 46 38"/><path d="M8 8Q14 10 18 6M14 14Q24 14 28 4M20 20Q34 20 38 6M26 26Q42 24 46 10"/></svg>
</header>

<section class="player" id="pl">
  <button class="art" id="art" aria-label="Cover" style="font-size:36px">♪</button>
  <div class="meta"><div class="title" id="tt">Koi gaana nahi</div><div class="artist" id="ar">Music add karo</div><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="seek"><input type="range" id="sk" value="0" min="0" max="100" step=".1" aria-label="Seek"><div class="time"><span id="c">0:00</span><span id="d">0:00</span></div></div>
  <div class="ctl"><button id="sh" data-i="shuffle" aria-label="Shuffle"></button><button id="pv" data-i="prev" aria-label="Previous"></button><button class="pp" id="pp" aria-label="Play"></button><button id="nx" data-i="next" aria-label="Next"></button><button id="rp" data-i="repeat" aria-label="Repeat"></button></div>
</section>

<div class="sec" id="photos"><h2>Photos</h2><button class="slide" id="sl"><svg class="i f" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg> Slideshow</button></div>
<div class="mas" id="gr"></div>

<div class="sec" id="music"><h2>Playlist</h2><span class="count" id="cn"></span></div>
<div id="sg"></div>

<nav>
<div class="sheet"><div class="in">
  <label class="opt"><span class="ic" data-i="image"></span><span>Photos add karo<small>Gallery se chuno</small></span><input type="file" id="fp" accept="image/*" multiple></label>
  <label class="opt"><span class="ic" data-i="music"></span><span>Music add karo<small>MP3 / audio file</small></span><input type="file" id="fm" accept="audio/*" multiple></label>
  <label class="opt"><span class="ic" data-i="cover"></span><span>Cover image badlo<small>Player ki album art</small></span><input type="file" id="fc" accept="image/*"></label>
</div></div>
<div class="bar">
  <button id="nh" class="act"><span data-i="home"></span>Home</button>
  <button id="np"><span data-i="image"></span>Photos</button>
  <button class="add adm" id="na" aria-label="Add"><span data-i="plus"></span></button>
  <button id="nm"><span data-i="music"></span>Music</button>
  <button id="ne" class="adm"><span data-i="edit"></span>Edit</button>
</div><button class="alink" id="al">Admin</button></nav>

<div id="toast"></div>
<dialog id="lg"><form id="lf"><h3>Admin Login</h3><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><div><button type="button" onclick="this.closest('dialog').close()">Cancel</button><button class="go">Login</button></div></form></dialog>
<div id="lb"><button class="x" aria-label="Close">✕</button><img alt=""><div class="cap"></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const P={shuffle:'<path d="M3 6h3c5 0 6 12 11 12h4M3 18h3c1.6 0 2.7-1 3.7-2.4M14.3 8.4C15.3 7 16.4 6 18 6h3M18 3l3 3-3 3M18 15l3 3-3 3"/>',prev:'<path class="f" d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor" stroke="none"/>',next:'<path d="M16 5h2v14h-2zM4 5l11 7L4 19z" fill="currentColor" stroke="none"/>',repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>',play:'<path d="M7 4v16l13-8z" fill="currentColor" stroke="none"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor" stroke="none"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/>',cover:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
function icons(r){r.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i))}icons(document);

/* demo photos: generated artwork */
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
const PAL=[['#1b0508','#e5202f','#ffd6d9'],['#0a0a12','#6a1b9a','#ff8fb8'],['#120305','#b3121f','#ffffff'],['#06141c','#0f6b85','#ff9cc4'],['#1a0a14','#d81b60','#ffe0ec'],['#0b0b0b','#5a0c13','#ff4a57'],['#160a22','#3a1c71','#ffafbd'],['#0d1117','#e5202f','#9fe8ff'],['#1d0a0c','#ff5a3c','#fff1d6'],['#050505','#7a0f1a','#ffffff']];
const NAMES=['Rooftop Night','Neon Rain','Web Swing','City Lights','Pink Skyline','Midnight Patrol','Dusk Jump','Red Alley','Golden Hour','Last Light'];
function scene(i){
  const r=rnd(i*977+13),[a,b,c]=PAL[i],W=600,H=[750,600,450,750,600,525,750,450,600,750][i];
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".75" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
  s+=`<circle cx="${120+r()*360}" cy="${H*.28}" r="${46+r()*40}" fill="${c}" opacity=".9"/>`;
  for(let k=0;k<2;k++){let x=-20,col=k?a:'#000',op=k?.9:.55;const base=H-(k?0:60);
    while(x<W){const w=38+r()*56,h=(k?120:190)+r()*(k?150:230);s+=`<rect x="${x}" y="${base-h}" width="${w}" height="${h+60}" fill="${col}" opacity="${op}"/>`;
      if(k)for(let y=base-h+14;y<base-6;y+=20)for(let q=x+7;q<x+w-8;q+=14)if(r()>.62)s+=`<rect x="${q}" y="${y}" width="6" height="9" fill="${c}" opacity=".85"/>`;x+=w+4}}
  s+=`<g stroke="#fff" stroke-opacity=".4" fill="none" stroke-width="1.2">`;
  for(let k=0;k<6;k++){const an=k*Math.PI/10;s+=`<line x1="0" y1="0" x2="${300*Math.cos(an)}" y2="${300*Math.sin(an)}"/>`}
  for(let q=50;q<300;q+=55)s+=`<path d="M${q} 0Q${q*.62} ${q*.62} 0 ${q}"/>`;
  s+=`</g><rect width="${W}" height="${H}" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="10"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
const demo=NAMES.map((n,i)=>({id:'d'+i,t:'p',n,u:scene(i),demo:1}));

/* storage: Supabase */
const C=window.CFG||{},BK=C.BUCKET||'album';let sb=null,admin=false;
try{sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY)}catch(e){}
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)};
const all=async()=>{if(!sb)return[];const r=await sb.from('items').select('*').order('created_at');return r.error?[]:r.data};
const upl=async(kind,blob,name)=>{const ext=(name.match(/\.[^.]+$/)||[''])[0].toLowerCase();const path=kind+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+ext;
  let r=await sb.storage.from(BK).upload(path,blob,{contentType:blob.type||undefined});if(r.error)throw r.error;
  const url=sb.storage.from(BK).getPublicUrl(path).data.publicUrl;
  r=await sb.from('items').insert({kind,name,path,url});if(r.error)throw r.error};
const del=async o=>{await sb.storage.from(BK).remove([o.path]);await sb.from('items').delete().eq('id',o.id)};
const shrink=f=>new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(x=>res(x||f),'image/jpeg',.82)};im.onerror=()=>res(f);im.src=URL.createObjectURL(f)});

let own=[],hidden=new Set(),songs=[],cur=-1,shuf=false,rep=false,editing=false;const likedSongs=new Set();
const au=new Audio(),fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const photos=()=>own.length?own:demo.filter(d=>!hidden.has(d.id));
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');

async function load(){
  const a=await all();a.forEach(x=>x.n=x.name);
  own=a.filter(x=>x.kind==='photo').reverse();songs=a.filter(x=>x.kind==='song');
  const cv=a.filter(x=>x.kind==='cover').pop();
  if(cv){$('art').style.backgroundImage=`url(${cv.url})`;$('art').textContent=''}
  render()}
function render(){
  const g=$('gr');g.innerHTML='';const L=photos();
  if(!L.length)g.innerHTML='<div class="empty">Album khali hai. Neeche + dabake photos add karo.</div>';
  L.forEach((p,i)=>{const d=document.createElement('div');d.className='ph';
    const im=new Image();im.src=p.url||p.u;im.loading='lazy';im.alt=p.n;d.appendChild(im);
    const x=document.createElement('b');x.textContent='✕';d.appendChild(x);
    d.onclick=async e=>{if(editing){if(e.target===x){if(p.demo)hidden.add(p.id);else await del(p);load()}}else show(i)};g.appendChild(d)});
  const s=$('sg');s.innerHTML='';$('cn').textContent=songs.length?songs.length+' tracks':'';
  if(!songs.length)s.innerHTML='<div class="empty">Abhi koi gaana nahi. Neeche + dabake music add karo.</div>';
  songs.forEach((o,i)=>{const d=document.createElement('div');d.className='tr'+(i===cur?' cur':'');
    d.innerHTML=`<span class="n">${i+1}</span><span class="t"></span><button class="fav" type="button" aria-label="Like song" aria-pressed="false">♡</button><u>✕</u>`;d.querySelector('.t').textContent=clean(o.n);
    const fav=d.querySelector('.fav'),songId=String(o.id);fav.classList.toggle('liked',likedSongs.has(songId));fav.textContent=likedSongs.has(songId)?'♥':'♡';fav.setAttribute('aria-pressed',String(likedSongs.has(songId)));fav.setAttribute('aria-label',likedSongs.has(songId)?'Unlike song':'Like song');
    fav.onclick=e=>{e.stopPropagation();likedSongs.has(songId)?likedSongs.delete(songId):likedSongs.add(songId);render()};
    d.querySelector('u').onclick=async e=>{e.stopPropagation();await del(o);if(i===cur){au.pause();cur=-1;$('tt').textContent='Koi gaana nahi'}load()};
    d.onclick=()=>{if(!editing)play(i)};s.appendChild(d)});
  document.body.classList.toggle('edit',editing);g.classList.toggle('edit',editing);s.classList.toggle('edit',editing)}
function play(i){if(!songs.length)return;cur=(i+songs.length)%songs.length;const o=songs[cur];au.src=o.url;au.play().catch(()=>{});$('tt').textContent=clean(o.n);$('ar').textContent='My Playlist';render()}
const next=d=>{if(!songs.length)return;shuf&&d>0?play(Math.floor(Math.random()*songs.length)):play(cur<0?0:cur+d)};
function pp(){$('pp').innerHTML=ic(au.paused?'play':'pause');$('pl').classList.toggle('playing',!au.paused)}pp();
$('pp').onclick=()=>{if(cur<0)return play(0);au.paused?au.play():au.pause()};
$('nx').onclick=()=>next(1);$('pv').onclick=()=>next(-1);
$('sh').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf)};
$('rp').onclick=e=>{rep=!rep;e.currentTarget.classList.toggle('on',rep)};
au.onplay=pp;au.onpause=pp;au.onended=()=>rep?play(cur):next(1);
au.onloadedmetadata=()=>$('d').textContent=fmt(au.duration);
au.ontimeupdate=()=>{$('c').textContent=fmt(au.currentTime);if(au.duration){const v=au.currentTime/au.duration*100;$('sk').value=v;$('sk').style.setProperty('--p',v+'%')}};
$('sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration;e.target.style.setProperty('--p',e.target.value+'%')};

/* navbar */
const B=document.body;
function sheet(f){B.classList.toggle('sheetOpen',f)}
$('na').onclick=()=>{sheet(!B.classList.contains('sheetOpen'));setTimeout(()=>$('na').scrollIntoView({block:'end',behavior:'smooth'}),40)};
function act(id){['nh','np','nm'].forEach(k=>$(k).classList.toggle('act',k===id))}
$('nh').onclick=()=>{sheet(0);act('nh');scrollTo({top:0})};
$('np').onclick=()=>{sheet(0);act('np');$('photos').scrollIntoView()};
$('nm').onclick=()=>{sheet(0);act('nm');$('music').scrollIntoView()};
$('ne').onclick=e=>{sheet(0);editing=!editing;e.currentTarget.classList.toggle('act',editing);e.currentTarget.lastChild.textContent=editing?'Done':'Edit';render()};
$('art').onclick=()=>{if(admin)$('fc').click()};
async function add(inp,kind){
  sheet(0);const fs=[...inp.files];inp.value='';
  if(!fs.length)return;
  let uploaded=0;const failed=[];
  toast(`${fs.length} file(s) upload ho rahi hain...`);
  for(const f of fs){
    try{await upl(kind,kind==='song'?f:await shrink(f),f.name);uploaded++}
    catch(e){failed.push({name:f.name,message:e.message||String(e)})}
  }
  await load();
  if(failed.length){
    failed.forEach(f=>console.error(`Upload failed: ${f.name}`,f.message));
    toast(`${uploaded}/${fs.length} uploaded; ${failed.length} failed: ${failed[0].name} — ${failed[0].message}`);
  }else toast(`${uploaded} file(s) add ho gayi ✓`);
}
$('fp').onchange=e=>add(e.target,'photo');$('fm').onchange=e=>add(e.target,'song');$('fc').onchange=e=>add(e.target,'cover');

/* lightbox */
let li=0,tm=null;const lb=$('lb'),im=lb.querySelector('img'),cp=lb.querySelector('.cap');
function show(i){const L=photos();if(!L.length)return;li=(i+L.length)%L.length;im.src=L[li].url||L[li].u;cp.textContent=`${li+1} / ${L.length}  ·  ${clean(L[li].n)}`;lb.classList.add('show')}
function close(){lb.classList.remove('show');clearInterval(tm);tm=null}
lb.onclick=e=>{if(e.target===im)show(li+1);else if(e.target===lb)close()};lb.querySelector('.x').onclick=close;
$('sl').onclick=()=>{show(0);clearInterval(tm);tm=setInterval(()=>show(li+1),2800)};
let tx=0;lb.ontouchstart=e=>tx=e.touches[0].clientX;lb.ontouchend=e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){clearInterval(tm);show(li+(d<0?1:-1))}};

function setAdmin(f){admin=f;B.classList.toggle('isAdmin',f);$('al').textContent=f?'Admin logout':'Admin'}
if(sb)sb.auth.getSession().then(r=>setAdmin(!!(r.data&&r.data.session)));else toast('config.js me Supabase keys daalo');
$('al').onclick=async()=>{if(admin){await sb.auth.signOut();setAdmin(false);editing=false;render()}else if(sb)$('lg').showModal()};
$('lf').onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:$('le').value,password:$('lp').value});if(r.error)toast('Login fail: '+r.error.message);else{setAdmin(true);$('lg').close();toast('Admin login ho gaya')}};
render();load();
})();
</script>
</body>
